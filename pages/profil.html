<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mon profil — Alternance Suite</title>
<link rel="stylesheet" href="../style.css" />
</head>
<body>
<div class="app-shell">
  <div class="sidebar-scrim" id="sidebar-scrim"></div>
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="dot"></span><span id="sidebar-brand-name">Alternance Suite</span></div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="hamburger" id="hamburger">☰</button>
        <div class="topbar-title" id="topbar-title">Mon profil</div>
      </div>
      <div id="topbar-user" style="font-size:13px;color:var(--text-muted);font-weight:600;"></div>
    </header>
    <div class="content">
      <form id="profil-form">
        <div class="panel">
          <h3 style="margin-bottom:14px;">Informations personnelles</h3>
          <div class="form-grid">
            <div class="field"><label>Prénom</label><input id="p-prenom" /></div>
            <div class="field"><label>Nom</label><input id="p-nom" /></div>
            <div class="field"><label>Email</label><input id="p-email" type="email" /></div>
            <div class="field"><label>Téléphone</label><input id="p-telephone" /></div>
            <div class="field"><label>Ville</label><input id="p-ville" /></div>
            <div class="field"><label>Disponibilité</label><input id="p-disponibilite" placeholder="Ex : dès septembre 2026" /></div>
          </div>
        </div>

        <div class="panel">
          <h3 style="margin-bottom:14px;">Parcours</h3>
          <div class="form-grid">
            <div class="field"><label>Formation</label><input id="p-formation" /></div>
            <div class="field"><label>Diplôme</label><input id="p-diplome" /></div>
            <div class="field"><label>Niveau d'études</label><input id="p-niveau_etudes" /></div>
          </div>
          <div class="field"><label>Compétences</label><textarea id="p-competences"></textarea></div>
          <div class="field"><label>Expériences</label><textarea id="p-experiences"></textarea></div>
          <div class="field"><label>Objectifs professionnels</label><textarea id="p-objectifs"></textarea></div>
        </div>

        <div class="panel">
          <h3 style="margin-bottom:4px;">Ma lettre de motivation originale</h3>
          <p style="color:var(--text-muted);font-size:13px;margin-bottom:12px;">
            Cette lettre sert de base à l'IA pour générer tes lettres personnalisées. Elle ne doit contenir que des informations réelles : l'IA ne l'utilisera jamais pour inventer un parcours.
          </p>
          <div class="field"><textarea id="p-lettre_originale" style="min-height:220px;"></textarea></div>
        </div>

        <div class="panel">
          <h3 style="margin-bottom:14px;">CV</h3>
          <div id="cv-current" style="margin-bottom:12px;font-size:14px;"></div>
          <input type="file" id="cv-file" accept=".pdf,.doc,.docx" />
        </div>

        <div class="error-msg" id="profil-error"></div>
        <div class="success-msg" id="profil-success"></div>
        <button type="submit" class="btn btn-primary" id="btn-save-profil"><span class="icon">💾</span>Enregistrer mon profil</button>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/profil.js"></script>
</body>
</html>
