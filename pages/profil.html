<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mon profil — Alternance Suite</title>
<link rel="icon" type="image/x-icon" href="../favicon.ico" />
<link rel="stylesheet" href="../style.css" />
</head>
<body>
<div class="app-shell">
  <div class="sidebar-scrim" id="sidebar-scrim"></div>
  <aside class="sidebar">
    <div class="sidebar-brand"><svg class="brand-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Alternance Suite"><defs><linearGradient id="brandGradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1cc691"/><stop offset="1" stop-color="#0f7a58"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="16" fill="url(#brandGradient)"/><g fill="none" stroke="#0b0d12" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 15 L17 47.5"/><path d="M32 15 L47 47.5"/><path d="M23.3 34.6 H40.7"/></g></svg><span id="sidebar-brand-name">Alternance Suite</span></div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="hamburger" id="hamburger"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <div class="topbar-title" id="topbar-title">Mon profil</div>
      </div>
      <div id="topbar-user" style="font-size:13px;color:var(--text-muted);font-weight:600;"></div>
    </header>
    <div class="content">
      <form id="profil-form">
        <div class="panel">
          <h3 style="margin-bottom:14px;">Informations personnelles</h3>
          <div class="form-grid">
            <div class="field"><label>Prénom</label><input id="p-prenom" /></div>
            <div class="field"><label>Nom</label><input id="p-nom" /></div>
            <div class="field"><label>Email</label><input id="p-email" type="email" /></div>
            <div class="field"><label>Téléphone</label><input id="p-telephone" /></div>
            <div class="field"><label>Ville</label><input id="p-ville" /></div>
            <div class="field"><label>Disponibilité</label><input id="p-disponibilite" placeholder="Ex : dès septembre 2026" /></div>
          </div>
        </div>

        <div class="panel">
          <h3 style="margin-bottom:14px;">Parcours</h3>
          <div class="form-grid">
            <div class="field"><label>Formation</label><input id="p-formation" /></div>
            <div class="field"><label>Diplôme</label><input id="p-diplome" /></div>
            <div class="field"><label>Niveau d'études</label><input id="p-niveau_etudes" /></div>
          </div>
          <div class="field"><label>Compétences</label><textarea id="p-competences"></textarea></div>
          <div class="field"><label>Expériences</label><textarea id="p-experiences"></textarea></div>
          <div class="field"><label>Objectifs professionnels</label><textarea id="p-objectifs"></textarea></div>
        </div>

        <div class="panel">
          <h3 style="margin-bottom:4px;">Ma lettre de motivation originale</h3>
          <p style="color:var(--text-muted);font-size:13px;margin-bottom:12px;">
            Cette lettre sert de base à l'IA pour générer tes lettres personnalisées. Elle ne doit contenir que des informations réelles : l'IA ne l'utilisera jamais pour inventer un parcours.
          </p>
          <div class="field"><textarea id="p-lettre_originale" style="min-height:220px;"></textarea></div>
        </div>

        <div class="panel">
          <h3 style="margin-bottom:14px;">CV</h3>
          <div id="cv-current" style="margin-bottom:12px;font-size:14px;"></div>
          <input type="file" id="cv-file" accept=".pdf,.doc,.docx" />
        </div>

        <div class="error-msg" id="profil-error"></div>
        <div class="success-msg" id="profil-success"></div>
        <button type="submit" class="btn btn-primary" id="btn-save-profil"><span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg></span>Enregistrer mon profil</button>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/profil.js"></script>
</body>
</html>
