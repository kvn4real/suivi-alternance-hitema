<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Campagnes</title>
<link rel="icon" type="image/x-icon" href="../favicon.ico" />
<link rel="stylesheet" href="../style.css" />
</head>
<body>
<div class="app-shell">
  <div class="sidebar-scrim" id="sidebar-scrim"></div>
  <aside class="sidebar">
    <div class="sidebar-brand"><svg class="brand-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Alternance Suite"><defs><linearGradient id="brandGradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1cc691"/><stop offset="1" stop-color="#0f7a58"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="16" fill="url(#brandGradient)"/><g fill="none" stroke="#0b0d12" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 15 L17 47.5"/><path d="M32 15 L47 47.5"/><path d="M23.3 34.6 H40.7"/></g></svg><span id="sidebar-brand-name">Alternance Suite</span></div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="hamburger" id="hamburger"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <div class="topbar-title" id="topbar-title">Campagnes</div>
      </div>
      <div id="topbar-user" style="font-size:13px;color:var(--text-muted);font-weight:600;"></div>
    </header>
    <div class="content">
      <div class="toolbar" id="toolbar-actions"></div>
      <div id="campagnes-grid" class="stats-grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr));"></div>

      <div class="panel hidden" id="campagne-detail-panel">
        <div class="panel-header">
          <h3 id="campagne-detail-title"></h3>
          <button class="btn btn-sm btn-ghost" id="btn-close-campagne-detail"><span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></span>Toutes les campagnes</button>
        </div>
        <div id="campagne-entreprises"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="modal-campagne">
  <div class="modal">
    <div class="modal-header"><h3>Nouvelle campagne</h3><button class="modal-close" onclick="closeModal('modal-campagne')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
    <div class="modal-body">
      <div class="field"><label>Nom *</label><input id="camp-nom" placeholder="Campagne #3" /></div>
      <div class="form-grid">
        <div class="field"><label>Date de début</label><input id="camp-date_debut" type="date" /></div>
        <div class="field"><label>Date de fin</label><input id="camp-date_fin" type="date" /></div>
      </div>
      <div class="field"><label>Description</label><textarea id="camp-description" placeholder="Ex : 50 entreprises ciblées secteur IT Île-de-France"></textarea></div>
      <div class="error-msg" id="camp-error"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('modal-campagne')">Annuler</button>
      <button class="btn btn-primary" id="btn-save-campagne">Créer</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/campagnes.js"></script>
</body>
</html>
