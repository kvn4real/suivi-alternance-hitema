<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Paramètres — Alternance Suite</title>
<link rel="stylesheet" href="../style.css" />
</head>
<body>
<div class="app-shell">
  <div class="sidebar-scrim" id="sidebar-scrim"></div>
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="dot"></span><span id="sidebar-brand-name">Alternance Suite</span></div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="hamburger" id="hamburger">☰</button>
        <div class="topbar-title" id="topbar-title">Paramètres</div>
      </div>
      <div id="topbar-user" style="font-size:13px;color:var(--text-muted);font-weight:600;"></div>
    </header>
    <div class="content">

      <div class="panel" id="panel-accompagnateur">
        <h3 style="margin-bottom:4px;"><span class="icon">👥</span>Accompagnateur</h3>
        <p style="color:var(--text-muted);font-size:13px;margin-bottom:16px;">
          Invite une personne (parent, enseignant, mentor...) pour suivre ta recherche d'alternance. Elle pourra consulter tes candidatures et laisser des notes, sans pouvoir modifier tes données.
        </p>
        <div id="companion-list" style="margin-bottom:16px;"></div>
        <form id="invite-form" style="display:flex;gap:10px;flex-wrap:wrap;">
          <input type="email" id="invite-email" placeholder="email@exemple.fr" required style="flex:1;min-width:220px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);" />
          <button type="submit" class="btn btn-primary">Envoyer l'invitation</button>
        </form>
        <div class="error-msg" id="invite-error"></div>
        <div class="success-msg" id="invite-success"></div>
      </div>

      <div class="panel" id="panel-linked-candidate"></div>

      <div class="panel">
        <h3 style="margin-bottom:14px;"><span class="icon">🔒</span>Sécurité du compte</h3>
        <form id="password-form" class="form-grid">
          <div class="field"><label>Nouveau mot de passe</label><input type="password" id="new-password" minlength="8" /></div>
          <div class="field"><label>Confirmation</label><input type="password" id="new-password-confirm" minlength="8" /></div>
        </form>
        <button class="btn" id="btn-change-password">Changer le mot de passe</button>
        <div class="error-msg" id="password-error"></div>
        <div class="success-msg" id="password-success"></div>
      </div>

    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/parametres.js"></script>
</body>
</html>
