<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Alternance Suite</title>
<link rel="stylesheet" href="../style.css" />
</head>
<body>
<div class="app-shell">
  <div class="sidebar-scrim" id="sidebar-scrim"></div>
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="dot"></span><span id="sidebar-brand-name">Alternance Suite</span></div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="hamburger" id="hamburger"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <div class="topbar-title" id="topbar-title">Dashboard</div>
      </div>
      <div id="topbar-user" style="font-size:13px;color:var(--text-muted);font-weight:600;"></div>
    </header>

    <div class="content" id="content">
      <div class="loading-spinner"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/dashboard.js"></script>
</body>
</html>
