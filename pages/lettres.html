<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lettres — Alternance Suite</title>
<link rel="stylesheet" href="../style.css" />
</head>
<body>
<div class="app-shell">
  <div class="sidebar-scrim" id="sidebar-scrim"></div>
  <aside class="sidebar">
    <div class="sidebar-brand"><span class="dot"></span><span id="sidebar-brand-name">Alternance Suite</span></div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="hamburger" id="hamburger">☰</button>
        <div class="topbar-title" id="topbar-title">Lettres</div>
      </div>
      <div id="topbar-user" style="font-size:13px;color:var(--text-muted);font-weight:600;"></div>
    </header>

    <div class="content">
      <div id="letters-list-panel" class="panel">
        <h3 style="margin-bottom:14px;">Toutes les lettres</h3>
        <div id="letters-table"></div>
      </div>

      <div id="letter-editor-panel" class="panel hidden">
        <div class="panel-header">
          <div>
            <h3 id="editor-entreprise-name"></h3>
            <p style="color:var(--text-muted);font-size:13px;" id="editor-date"></p>
          </div>
          <a href="lettres.html" class="btn btn-sm btn-ghost"><span class="icon">←</span>Retour à la liste</a>
        </div>
        <textarea class="letter-editor" id="letter-content" readonly></textarea>
        <div class="action-row" id="editor-actions"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="../config.js"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/lettres.js"></script>
</body>
</html>
