<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Relances</title>
<link rel="icon" type="image/x-icon" href="../favicon.ico" />
<link rel="stylesheet" href="../style.css" />
</head>
<body>
<div class="app-shell">
  <div class="sidebar-scrim" id="sidebar-scrim"></div>
  <aside class="sidebar">
    <div class="sidebar-brand"><svg class="brand-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Alternance Suite"><defs><linearGradient id="brandGradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1cc691"/><stop offset="1" stop-color="#0f7a58"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="16" fill="url(#brandGradient)"/><g fill="none" stroke="#0b0d12" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 15 L17 47.5"/><path d="M32 15 L47 47.5"/><path d="M23.3 34.6 H40.7"/></g></svg><span id="sidebar-brand-name">Alternance Suite</span></div>
    <nav class="sidebar-nav" id="sidebar-nav"></nav>
  </aside>
  <div class="main">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="hamburger" id="hamburger"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <div class="topbar-title" id="topbar-title">Relances</div>
      </div>
      <div id="topbar-user" style="font-size:13px;color:var(--text-muted);font-weight:600;"></div>
    </header>
    <div class="content">
      <div class="panel">
        <h3 style="margin-bottom:14px;"><span class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span>Relances à effectuer</h3>
        <div id="relances-list"></div>
      </div>
      <div class="panel">
        <h3 style="margin-bottom:14px;">Toutes les relances planifiées</h3>
        <div id="relances-all"></div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/relances.js"></script>
</body>
</html>
